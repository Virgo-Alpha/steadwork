[project]
name = "steadwork-backend"
version = "0.1.0"
description = "Steadwork API backend"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "Django>=5.2,<6.0",
    "djangorestframework>=3.16,<4.0",
    "gunicorn>=23.0,<24.0",
    "opentelemetry-distro>=0.66b2",
    "opentelemetry-exporter-otlp>=1.45.2",
    "opentelemetry-instrumentation-django>=0.66b2",
    "opentelemetry-instrumentation-logging>=0.66b2",
    "opentelemetry-instrumentation-psycopg>=0.66b2",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-django>=4.11,<5.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "steadwork.test_settings"
pythonpath = ["."]
testpaths = ["api/tests"]

