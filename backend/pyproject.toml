[project]
name = "steadwork-backend"
version = "0.1.0"
description = "Steadwork API backend"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<6.0",
    "djangorestframework>=3.16,<4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-django>=4.11,<5.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "steadwork.settings"
pythonpath = ["."]
testpaths = ["api/tests"]

