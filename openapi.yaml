  /notifications/{id}/read/:
    post:
      operationId: markNotificationRead
      summary: Mark an owned notification read
      tags:
      - notifications
      description: Requires an authenticated session. Sends no request body.
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Successful operation; no response body.
        default:
          $ref: '#/components/responses/Error'
        '401':
          description: A required session is missing or invalid (when applicable to token verification).
            Error body is unspecified.
        '403':
          description: Permission, ownership, or CSRF validation failed. Error body is unspecified.
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: sessionid
      description: 'Session cookie sent by fetch credentials: include. Cookie name is assumed; the frontend
        does not inspect it.'
  schemas:
    UserRole:
      type: string
      enum:
      - candidate
      - company
      - admin
    AccountRole:
      type: string
      enum:
      - candidate
      - company
    JobStatus:
      type: string
      enum:
      - Draft
      - Published
      - Closed
      - Expired
    ApplicationStatus:
      type: string
      enum:
      - Applied
      - Under Review
      - Shortlisted
      - Rejected
      - Hired
      - Withdrawn
      - External click
    RemotePolicy:
      type: string
      enum:
      - Remote
      - Hybrid
      - On-site
    JobType:
      type: string
      enum:
      - Full-time
      - Part-time
      - Contract
      - Internship
    ExperienceLevel:
      type: string
      enum:
      - Entry
      - Mid
      - Senior
      - Lead
    Job:
      type: object
      properties:
        id: &id001
          type: string
        companyId: &id002
          type: string
        title: &id003
          type: string
        description: &id004
          type: string
        location: &id005
          type: string
        currency: &id006
          type: string
        externalApplyUrl: &id007
          type: string
        postedAt: &id008
          type: string
        deadline: &id009
          type: string
        salaryMin: &id010
          type: number
        salaryMax: &id011
          type: number
        skills: &id012
          type: array
          items:
            type: string
        responsibilities: &id013
          type: array
          items:
            type: string
        qualifications: &id014
          type: array
          items:
            type: string
        benefits: &id015
          type: array
          items:
            type: string
        remotePolicy: &id016
          $ref: '#/components/schemas/RemotePolicy'
        jobType: &id017
          $ref: '#/components/schemas/JobType'
        experienceLevel: &id018
          $ref: '#/components/schemas/ExperienceLevel'
        status: &id019
          $ref: '#/components/schemas/JobStatus'
        applicationMethod: &id020
          type: string
          enum:
          - Internal
          - External
        applicationCount: &id021
          type: number
      required:
      - id
      - companyId
      - title
      - description
      - location
      - currency
      - postedAt
      - deadline
      - salaryMin
      - salaryMax
      - skills
      - responsibilities
      - qualifications
      - benefits
      - remotePolicy
      - jobType
      - experienceLevel
      - status
      - applicationMethod
      - applicationCount
    JobInput:
      type: object
      properties:
        id: *id001
        companyId: *id002
        title: *id003
        description: *id004
        location: *id005
        currency: *id006
        externalApplyUrl: *id007
        postedAt: *id008
        deadline: *id009
        salaryMin: *id010
        salaryMax: *id011
        skills: *id012
        responsibilities: *id013
        qualifications: *id014
        benefits: *id015
        remotePolicy: *id016
        jobType: *id017
        experienceLevel: *id018
        status: *id019
        applicationMethod: *id020
        applicationCount: *id021
      description: 'Partial<Job>: every property is optional, for both creation and update, as accepted
        by the HTTP adapter. Server ownership and generated-field validation are backend responsibilities.'
    Company:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        website:
          type: string
