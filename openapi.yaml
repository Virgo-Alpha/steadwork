openapi: 3.1.0
info:
  title: Steadwork Frontend API Contract
  version: 1.0.0
  description: |
    Contract for the HTTP endpoints called by `frontend/src/services/http-job-board-service.ts`.
    Paths are relative to `/api`. Authentication uses the bearer access token returned
    by `POST /auth/login/`. Registration and candidate recommendations are supported.
    Email verification and password reset are currently disabled. Role switching and
    demo reset remain browser-mock-only.
servers:
  - url: /api
    description: Same-origin API base used by the frontend
tags:
  - name: Public
  - name: Authentication
  - name: Candidate
  - name: Applications
  - name: Employer
  - name: Notifications
paths:
  /jobs/:
    get:
      tags: [Public]
      operationId: listJobs
      summary: Search published jobs
      parameters:
        - { $ref: '#/components/parameters/keyword' }
        - { $ref: '#/components/parameters/location' }
        - name: jobType
          in: query
          schema: { $ref: '#/components/schemas/JobType' }
        - name: remotePolicy
          in: query
          schema: { $ref: '#/components/schemas/RemotePolicy' }
        - name: experienceLevel
          in: query
          schema: { $ref: '#/components/schemas/ExperienceLevel' }
        - name: salaryMin
          in: query
          schema: { type: number, minimum: 0 }
        - name: skills
          in: query
          description: Comma-separated skill names; all supplied skills must match.
          schema: { type: string }
        - name: companyId
          in: query
          schema: { type: string }
        - name: postedWithin
          in: query
          description: Maximum age of a posting in days.
          schema: { type: number, minimum: 0 }
        - name: sort
          in: query
          schema: { type: string, enum: [recent, salary, relevance] }
      responses:
        '200':
          description: Matching published jobs (JSON array).
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Job' } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /jobs/recommended/:
    get:
      tags: [Candidate]
      operationId: recommendJobs
      summary: Rank published jobs by overlap with the authenticated candidate's skills
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Ranked published jobs. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /jobs/{jobId}/:
    get:
      tags: [Public]
      operationId: getJob
      summary: Get a published job
      parameters:
        - { $ref: '#/components/parameters/jobId' }
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /companies/:
    get:
      tags: [Public]
      operationId: listCompanies
      summary: List companies
      responses:
        '200':
          description: Companies (JSON array)
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Company' } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /companies/{companyId}/:
    get:
      tags: [Public]
      operationId: getCompany
      summary: Get a company
      parameters:
        - name: companyId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Company
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /auth/login/:
    post:
      tags: [Authentication]
      operationId: login
      summary: Sign in and obtain a bearer token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200':
          description: Access token and signed-in user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout/:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Invalidate the current user's issued bearer tokens
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Signed out. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/register/:
    post:
      tags: [Authentication]
      operationId: registerAccount
      summary: Create a candidate or company account without email verification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, role]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 256 }
                role: { type: string, enum: [candidate, company] }
                companyName: { type: string, minLength: 1, maxLength: 160 }
      responses:
        '201': { description: Account created; response contains bearer token and user. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /auth/verify-email/:
    post:
      tags: [Authentication]
      operationId: verifyEmailDisabled
      summary: Disabled email verification endpoint
      security: []
      responses:
        '410': { description: Email verification is currently disabled. }
  /auth/password-reset/:
    post:
      tags: [Authentication]
      operationId: passwordResetDisabled
      summary: Disabled password reset endpoint
      security: []
      responses:
        '410': { description: Password reset is currently disabled. }
  /auth/me/:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: Get the authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /candidate/profile/:
    get:
      tags: [Candidate]
      operationId: getCandidateProfile
      summary: Get the current candidate profile
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Candidate profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidateProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Candidate]
      operationId: updateCandidateProfile
      summary: Partially update the current candidate profile
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CandidateProfileUpdate' }
      responses:
        '200':
          description: Updated candidate profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidateProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /candidate/applications/:
    get:
      tags: [Candidate, Applications]
      operationId: listCandidateApplications
      summary: List applications belonging to the current candidate
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Applications (JSON array)
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Application' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /saved-jobs/:
    get:
      tags: [Candidate]
      operationId: listSavedJobs
      summary: List jobs saved by the current candidate
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Saved jobs (JSON array)
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Job' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Candidate]
      operationId: saveJob
      summary: Save a job
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jobId]
              properties:
                jobId: { type: string }
      responses:
        '204': { description: Job saved; no response body. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /saved-jobs/{jobId}/:
    delete:
      tags: [Candidate]
      operationId: unsaveJob
      summary: Remove a saved job
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/jobId' }
      responses:
        '204': { description: Job removed; no response body. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /applications/:
    post:
      tags: [Applications]
      operationId: submitApplication
      summary: Submit an application as the authenticated candidate
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationInput' }
      responses:
        '201':
          description: Created application
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /applications/guest/:
    post:
      tags: [Applications]
      operationId: submitGuestApplication
      summary: Submit an application without signing in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationInput' }
      responses:
        '201':
          description: Created application
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /applications/{applicationId}/withdraw/:
    post:
      tags: [Candidate, Applications]
      operationId: withdrawApplication
      summary: Withdraw an application owned by the current candidate
      security: [{ bearerAuth: [] }]
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Updated application
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /employer/dashboard/:
    get:
      tags: [Employer]
      operationId: getEmployerDashboard
      summary: Get dashboard counts and recent company applications
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Employer dashboard
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployerDashboard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /employer/jobs/:
    get:
      tags: [Employer]
      operationId: listCompanyJobs
      summary: List jobs for the authenticated employer's company
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Company jobs (JSON array)
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Job' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Employer]
      operationId: createJob
      summary: Create a job for the authenticated employer's company
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobInput' }
      responses:
        '201':
          description: Created job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /employer/jobs/{jobId}/:
    patch:
      tags: [Employer]
      operationId: updateJob
      summary: Partially update a company job
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/jobId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobInput' }
      responses:
        '200':
          description: Updated job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /employer/jobs/{jobId}/status/:
    post:
      tags: [Employer]
      operationId: setJobStatus
      summary: Change a job's status
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/jobId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/JobStatus' }
      responses:
        '200':
          description: Updated job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /employer/jobs/{jobId}/applications/:
    get:
      tags: [Employer, Applications]
      operationId: listApplicants
      summary: List applications for a company job
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/jobId' }
      responses:
        '200':
          description: Applications (JSON array)
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Application' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /employer/applications/{applicationId}/status/:
    post:
      tags: [Employer, Applications]
      operationId: updateApplicationStatus
      summary: Advance an application to an allowed status
      security: [{ bearerAuth: [] }]
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/ApplicationStatus' }
      responses:
        '200':
          description: Updated application
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /notifications/:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: List notifications for the current user
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Notifications (JSON array)
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Notification' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /notifications/{notificationId}/read/:
    post:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Mark a notification as read
      security: [{ bearerAuth: [] }]
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Notification marked read; no response body. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Opaque access token
  parameters:
    jobId:
      name: jobId
      in: path
      required: true
      schema: { type: string }
    keyword:
      name: keyword
      in: query
      schema: { type: string }
    location:
      name: location
      in: query
      schema: { type: string }
  responses:
    BadRequest:
      description: Invalid request; may include field or validation detail.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing, invalid, or expired credentials (or invalid login).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated user lacks the required role, membership, or ownership.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Requested resource was not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Request conflicts with existing application data.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [detail]
      properties:
        detail: { type: string }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    LoginResponse:
      type: object
      required: [access_token, token_type, user]
      properties:
        access_token: { type: string }
        token_type: { type: string, const: Bearer }
        user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      required: [id, name, email, role]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [candidate, company, recruiter, admin] }
        emailVerified: { type: boolean }
    Job:
      type: object
      required: [id, companyId, title, description, location, remotePolicy, jobType, salaryMin, salaryMax, currency, experienceLevel, skills, responsibilities, qualifications, benefits, applicationMethod, status, postedAt, deadline, applicationCount]
      properties:
        id: { type: string }
        companyId: { type: string }
        title: { type: string }
        description: { type: string }
        location: { type: string }
        remotePolicy: { $ref: '#/components/schemas/RemotePolicy' }
        jobType: { $ref: '#/components/schemas/JobType' }
        salaryMin: { type: number }
        salaryMax: { type: number }
        currency: { type: string }
        experienceLevel: { $ref: '#/components/schemas/ExperienceLevel' }
        skills: { type: array, items: { type: string } }
        responsibilities: { type: array, items: { type: string } }
        qualifications: { type: array, items: { type: string } }
        benefits: { type: array, items: { type: string } }
        applicationMethod: { type: string, enum: [Internal, External] }
        externalApplyUrl: { type: string }
        status: { $ref: '#/components/schemas/JobStatus' }
        postedAt: { type: string, format: date-time }
        deadline: { type: string, format: date-time }
        applicationCount: { type: integer }
    Company:
      type: object
      required: [id, name, description, website, logo, accent]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        website: { type: string }
        logo: { type: string }
        accent: { type: string }
    CandidateProfile:
      type: object
      required: [userId, headline, location, skills, experience, education, preferences, cvFiles, defaultCvId]
      properties:
        userId: { type: string }
        headline: { type: string }
        location: { type: string }
        skills: { type: array, items: { type: string } }
        experience: { type: string }
        education: { type: string }
        preferences: { type: string }
        cvFiles: { type: array, items: { type: string } }
        defaultCvId: { type: string }
    CandidateProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        userId: { type: string, description: Must match the authenticated user's ID. }
        headline: { type: string }
        location: { type: string }
        skills: { type: array, items: { type: string } }
        experience: { type: string }
        education: { type: string }
        preferences: { type: string }
        cvFiles: { type: array, items: { type: string } }
        defaultCvId: { type: string }
    ApplicationInput:
      type: object
      required: [jobId, candidateName, candidateEmail, cvName, coverLetter]
      properties:
        jobId: { type: string }
        candidateName: { type: string }
        candidateEmail: { type: string, format: email }
        cvName: { type: string, description: CV name/reference; this endpoint does not upload a file. }
        coverLetter: { type: string }
    Application:
      type: object
      required: [id, jobId, candidateName, candidateEmail, cvName, coverLetter, status, createdAt]
      properties:
        id: { type: string }
        jobId: { type: string }
        candidateId: { type: string }
        candidateName: { type: string }
        candidateEmail: { type: string, format: email }
        cvName: { type: string }
        coverLetter: { type: string }
        status: { $ref: '#/components/schemas/ApplicationStatus' }
        createdAt: { type: string, format: date-time }
    EmployerDashboard:
      type: object
      required: [companyName, activeJobs, totalJobs, applications, shortlisted, recent]
      properties:
        companyName: { type: string }
        activeJobs: { type: integer }
        totalJobs: { type: integer }
        applications: { type: integer }
        shortlisted: { type: integer }
        recent: { type: array, items: { $ref: '#/components/schemas/Application' } }
    Notification:
      type: object
      required: [id, title, body, createdAt]
      properties:
        id: { type: string }
        title: { type: string }
        body: { type: string }
        readAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    JobInput:
      type: object
      additionalProperties: false
      properties:
        title: { type: string }
        description: { type: string }
        location: { type: string }
        salaryMin: { type: number }
        salaryMax: { type: number }
        currency: { type: string }
        remotePolicy: { $ref: '#/components/schemas/RemotePolicy' }
        jobType: { $ref: '#/components/schemas/JobType' }
        experienceLevel: { $ref: '#/components/schemas/ExperienceLevel' }
        skills: { type: array, items: { type: string } }
        responsibilities: { type: array, items: { type: string } }
        qualifications: { type: array, items: { type: string } }
        benefits: { type: array, items: { type: string } }
        applicationMethod: { type: string, enum: [Internal, External] }
        externalApplyUrl: { type: string }
        deadline: { type: string, format: date-time }
    JobStatus:
      type: string
      enum: [Draft, Published, Closed, Expired]
    ApplicationStatus:
      type: string
      enum: [Applied, Under Review, Shortlisted, Rejected, Hired, Withdrawn, External click]
    JobType:
      type: string
      enum: [Full-time, Part-time, Contract, Internship]
    RemotePolicy:
      type: string
      enum: [Remote, Hybrid, On-site]
    ExperienceLevel:
      type: string
      enum: [Entry, Mid, Senior, Lead]
