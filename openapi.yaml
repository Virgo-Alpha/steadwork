openapi: 3.0.3
info:
  title: Steadwork Backend API
  version: 1.0.0
  description: >-
    Contract for the API consumed by the frontend HTTP job board service.
    Paths are mounted below /api. Registration, password reset, recommendations,
    email verification, role switching, and demo reset are not exposed by this
    backend client and are not part of this contract.
servers:
  - url: /api
    description: API prefix (the frontend prepends /api to every request)
tags:
  - name: Health
  - name: Authentication
  - name: Jobs
  - name: Companies
  - name: Candidate
  - name: Applications
  - name: Employer
  - name: Notifications
paths:
  /health/:
    get:
      tags: [Health]
      summary: Backend liveness and store status
      security: []
      responses:
        '200':
          description: Service is responding
          content:
            application/json:
              schema:
                type: object
                required: [status, service, store, authenticated]
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: steadwork-backend }
                  store: { type: string, example: sqlite }
                  authenticated: { type: boolean }
  /auth/login/:
    post:
      tags: [Authentication]
      summary: Sign in and receive a bearer token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, user]
                properties:
                  access_token: { type: string }
                  token_type: { type: string, enum: [Bearer] }
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/me/:
    get:
      tags: [Authentication]
      summary: Get the current user
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /jobs/:
    get:
      tags: [Jobs]
      summary: List published jobs
      security: []
      parameters:
        - { name: keyword, in: query, schema: { type: string } }
        - { name: location, in: query, schema: { type: string } }
        - { name: jobType, in: query, schema: { type: string, enum: [Full-time, Part-time, Contract, Internship] } }
        - { name: remotePolicy, in: query, schema: { type: string, enum: [Remote, Hybrid, On-site] } }
        - { name: experienceLevel, in: query, schema: { type: string, enum: [Entry, Mid, Senior, Lead] } }
        - { name: salaryMin, in: query, schema: { type: number, minimum: 0 } }
        - name: skills
          in: query
          description: Comma-separated list; all supplied skills must match.
          schema: { type: string }
        - { name: companyId, in: query, schema: { type: string } }
        - { name: postedWithin, in: query, description: Maximum age in days, schema: { type: number, minimum: 0 } }
        - { name: sort, in: query, schema: { type: string, enum: [recent, salary, relevance], default: recent } }
      responses:
        '200':
          description: Matching jobs
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Job' } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /jobs/{jobId}/:
    get:
      tags: [Jobs]
      summary: Get a published job
      security: []
      parameters:
        - { $ref: '#/components/parameters/jobId' }
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '404': { $ref: '#/components/responses/NotFound' }
  /companies/:
    get:
      tags: [Companies]
      summary: List companies
      security: []
      responses:
        '200':
          description: Companies
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Company' } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /companies/{companyId}/:
    get:
      tags: [Companies]
      summary: Get a company
      security: []
      parameters:
        - { name: companyId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Company
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '404': { $ref: '#/components/responses/NotFound' }
  /saved-jobs/:
    get:
      tags: [Candidate]
      summary: List the candidate's saved jobs
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Saved jobs
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Job' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Candidate]
      summary: Save a job
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jobId]
              properties:
                jobId: { type: string }
      responses:
        '204': { description: Job saved; response body is empty }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /saved-jobs/{jobId}/:
    delete:
      tags: [Candidate]
      summary: Remove a saved job
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/jobId' }
      responses:
        '204': { description: Job removed; response body is empty }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /candidate/profile/:
    get:
      tags: [Candidate]
      summary: Get the candidate profile
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Candidate profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidateProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Candidate]
      summary: Partially update the candidate profile
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CandidateProfilePatch' }
      responses:
        '200':
          description: Updated candidate profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidateProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /candidate/applications/:
    get:
      tags: [Candidate, Applications]
      summary: List the current candidate's applications
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Applications
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Application' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /applications/:
    post:
      tags: [Applications]
      summary: Apply as the authenticated candidate
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationInput' }
      responses:
        '201':
          description: Created application
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /applications/guest/:
    post:
      tags: [Applications]
      summary: Submit a guest application
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationInput' }
      responses:
        '201':
          description: Created application
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /applications/{applicationId}/withdraw/:
    post:
      tags: [Applications]
      summary: Withdraw an application belonging to the candidate
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: applicationId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Withdrawn application
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /employer/dashboard/:
    get:
      tags: [Employer]
      summary: Get the employer dashboard summary
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Dashboard summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployerDashboard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /employer/jobs/:
    get:
      tags: [Employer, Jobs]
      summary: List jobs owned by the employer's company
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Company jobs
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Job' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Employer, Jobs]
      summary: Create a company job
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobInput' }
      responses:
        '201':
          description: Created job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /employer/jobs/{jobId}/:
    patch:
      tags: [Employer, Jobs]
      summary: Partially update a company job
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/jobId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobInput' }
      responses:
        '200':
          description: Updated job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /employer/jobs/{jobId}/status/:
    post:
      tags: [Employer, Jobs]
      summary: Change a job's status
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/jobId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [Draft, Published, Closed, Expired] }
      responses:
        '200':
          description: Updated job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /employer/jobs/{jobId}/applications/:
    get:
      tags: [Employer, Applications]
      summary: List applicants to a company job
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/jobId' }
      responses:
        '200':
          description: Applications for the job
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Application' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /employer/applications/{applicationId}/status/:
    post:
      tags: [Employer, Applications]
      summary: Change an applicant's status
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: applicationId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [Applied, Under Review, Shortlisted, Rejected, Hired] }
      responses:
        '200':
          description: Updated application
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /notifications/:
    get:
      tags: [Notifications]
      summary: List notifications for the current user
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Notifications
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Notification' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /notifications/{notificationId}/read/:
    post:
      tags: [Notifications]
      summary: Mark a notification as read
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: notificationId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Notification marked read; response body is empty }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
  parameters:
    jobId:
      name: jobId
      in: path
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: Invalid request body or query parameter
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing, invalid, or expired authentication
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated user lacks the required role or ownership
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Request conflicts with an existing application
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [detail]
      properties:
        detail: { type: string }
    User:
      type: object
      required: [id, email, role]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [candidate, company, admin] }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    Job:
      type: object
      required: [id, companyId, title, description, location, salaryMin, salaryMax, currency, remotePolicy, jobType, experienceLevel, skills, responsibilities, qualifications, benefits, applicationMethod, status, postedAt, deadline, applicationCount]
      properties:
        id: { type: string }
        companyId: { type: string }
        title: { type: string }
        description: { type: string }
        location: { type: string }
        salaryMin: { type: number }
        salaryMax: { type: number }
        currency: { type: string }
        remotePolicy: { type: string, enum: [Remote, Hybrid, On-site] }
        jobType: { type: string, enum: [Full-time, Part-time, Contract, Internship] }
        experienceLevel: { type: string, enum: [Entry, Mid, Senior, Lead] }
        skills: { type: array, items: { type: string } }
        responsibilities: { type: array, items: { type: string } }
        qualifications: { type: array, items: { type: string } }
        benefits: { type: array, items: { type: string } }
        applicationMethod: { type: string, enum: [Internal, External] }
        externalApplyUrl: { type: string, format: uri }
        status: { type: string, enum: [Draft, Published, Closed, Expired] }
        postedAt: { type: string, format: date-time }
        deadline: { type: string, format: date-time }
        applicationCount: { type: integer }
    JobInput:
      type: object
      description: All fields are optional for the current create and patch handlers.
      properties:
        title: { type: string }
        description: { type: string }
        location: { type: string }
        salaryMin: { type: number }
        salaryMax: { type: number }
        currency: { type: string }
        remotePolicy: { type: string, enum: [Remote, Hybrid, On-site] }
        jobType: { type: string, enum: [Full-time, Part-time, Contract, Internship] }
        experienceLevel: { type: string, enum: [Entry, Mid, Senior, Lead] }
        skills: { type: array, items: { type: string } }
        responsibilities: { type: array, items: { type: string } }
        qualifications: { type: array, items: { type: string } }
        benefits: { type: array, items: { type: string } }
        applicationMethod: { type: string, enum: [Internal, External] }
        externalApplyUrl: { type: string, format: uri }
        deadline: { type: string, format: date-time }
    Company:
      type: object
      required: [id, name, description, website, logo, accent]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        website: { type: string }
        logo: { type: string }
        accent: { type: string }
    CandidateProfile:
      type: object
      required: [userId, headline, location, skills, experience, education, preferences, cvFiles, defaultCvId]
      properties:
        userId: { type: string }
        headline: { type: string }
        location: { type: string }
        skills: { type: array, items: { type: string } }
        experience: { type: string }
        education: { type: string }
        preferences: { type: string }
        cvFiles: { type: array, items: { type: string } }
        defaultCvId: { type: string }
    CandidateProfilePatch:
      type: object
      properties:
        userId: { type: string }
        headline: { type: string }
        location: { type: string }
        skills: { type: array, items: { type: string } }
        experience: { type: string }
        education: { type: string }
        preferences: { type: string }
        cvFiles: { type: array, items: { type: string } }
        defaultCvId: { type: string }
    ApplicationInput:
      type: object
      required: [jobId, candidateName, candidateEmail, cvName, coverLetter]
      properties:
        jobId: { type: string }
        candidateName: { type: string }
        candidateEmail: { type: string, format: email }
        cvName: { type: string }
        coverLetter: { type: string }
    Application:
      type: object
      required: [id, jobId, candidateName, candidateEmail, cvName, coverLetter, status, createdAt]
      properties:
        id: { type: string }
        jobId: { type: string }
        candidateId: { type: string }
        candidateName: { type: string }
        candidateEmail: { type: string, format: email }
        cvName: { type: string }
        coverLetter: { type: string }
        status: { type: string, enum: [Applied, Under Review, Shortlisted, Rejected, Hired, Withdrawn, External click] }
        createdAt: { type: string, format: date-time }
    EmployerDashboard:
      type: object
      required: [activeJobs, totalJobs, applications, shortlisted, recent]
      properties:
        activeJobs: { type: integer }
        totalJobs: { type: integer }
        applications: { type: integer }
        shortlisted: { type: integer }
        recent: { type: array, items: { $ref: '#/components/schemas/Application' } }
    Notification:
      type: object
      required: [id, title, body, createdAt]
      properties:
        id: { type: string }
        title: { type: string }
        body: { type: string }
        readAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
