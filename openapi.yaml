  /applications/guest/:
    post:
      operationId: submitGuestApplication
      summary: Submit a guest application
      tags:
      - applications
      security: []
      description: Authentication is not required. Guest applications have no candidateId and cannot be
        tracked or withdrawn through candidate endpoints. External applications may be recorded with status
        External click.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationInput'
      responses:
        '201':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        default:
          $ref: '#/components/responses/Error'
  /applications/{id}/withdraw/:
    post:
      operationId: withdrawApplication
      summary: Withdraw an owned application
      tags:
      - applications
      description: Requires an authenticated candidate session; access is scoped to the current candidate.
        Sends no request body. Returns the application with status Withdrawn.
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        default:
          $ref: '#/components/responses/Error'
        '401':
          description: A required session is missing or invalid (when applicable to token verification).
            Error body is unspecified.
        '403':
          description: Permission, ownership, or CSRF validation failed. Error body is unspecified.
  /employer/dashboard/:
    get:
      operationId: getEmployerDashboard
      summary: Get employer dashboard counts and recent applications
      tags:
      - employer
      description: Requires an authenticated company user and membership of the company owning the jobs/applications.
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployerDashboard'
        default:
          $ref: '#/components/responses/Error'
        '401':
          description: A required session is missing or invalid (when applicable to token verification).
            Error body is unspecified.
        '403':
          description: Permission, ownership, or CSRF validation failed. Error body is unspecified.
  /employer/jobs/:
    get:
      operationId: listCompanyJobs
      summary: List the company jobs
      tags:
      - employer
      description: Requires an authenticated company user and membership of the company owning the jobs/applications.
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'
        '401':
          description: A required session is missing or invalid (when applicable to token verification).
            Error body is unspecified.
        '403':
          description: Permission, ownership, or CSRF validation failed. Error body is unspecified.
    post:
      operationId: createJob
      summary: Create a company job
      tags:
      - employer
      description: Requires an authenticated company user and membership of the company owning the jobs/applications.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobInput'
      responses:
        '201':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'
        '401':
          description: A required session is missing or invalid (when applicable to token verification).
            Error body is unspecified.
        '403':
          description: Permission, ownership, or CSRF validation failed. Error body is unspecified.
  /employer/jobs/{id}/:
    patch:
      operationId: updateJob
      summary: Partially update an owned job
      tags:
      - employer
      description: Requires an authenticated company user and membership of the company owning the jobs/applications.
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobInput'
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'
        '401':
          description: A required session is missing or invalid (when applicable to token verification).
            Error body is unspecified.
        '403':
          description: Permission, ownership, or CSRF validation failed. Error body is unspecified.
  /employer/jobs/{id}/status/:
    post:
      operationId: setJobStatus
      summary: Change an owned job status
      tags:
      - employer
      description: Requires an authenticated company user and membership of the company owning the jobs/applications.
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobStatusInput'
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
