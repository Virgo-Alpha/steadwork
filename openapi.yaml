openapi: 3.0.3
info:
  title: Steadwork frontend backend contract
  version: 1.0.0
  description: 'Contract derived from frontend/src/services/http-job-board-service.ts and frontend/src/domain/types.ts,
    with permission assumptions from docs/backend-plan.md. No live backend is configured. All paths have
    trailing slashes and are relative to /api. Requests with bodies use application/json and camelCase
    keys. Lists are bare JSON arrays, without pagination envelopes.


    The client sends credentials: include on every request and does not send bearer tokens. Session-cookie
    authentication and role/ownership requirements below are proposed backend requirements, not enforced
    by the HTTP adapter or mock. The session cookie name sessionid is a Django convention assumed here.
    Registration and login must establish the browser session. The backend plan calls for CSRF protection
    on unsafe methods, but the current adapter sends no CSRF token; CSRF bootstrap/header handling must
    be resolved during backend integration.


    Success codes are conventional choices for this proposed contract: the client accepts any 2xx response,
    parses JSON unless the status is 204, and only uses status codes for errors. Methods returning void
    are specified as 204 with no body; an empty 200 would fail JSON parsing. Error response bodies are
    unspecified because the frontend never reads them. String IDs have no UUID constraint; date strings
    have no imposed format because the frontend uses both dates and timestamps. Optional TypeScript fields
    may be omitted, rather than returned as null.


    resetDemo() is a local no-op in the HTTP adapter and has no endpoint. There are no logout, password-reset
    completion, CV upload/download, company mutation, or employer job-detail GET operations in this adapter,
    even where planning notes mention future capabilities.'
servers:
- url: /api
  description: Same-origin API used by the frontend
security:
- sessionAuth: []
paths:
  /jobs/:
    get:
      operationId: listJobs
      summary: List published jobs
      tags:
      - jobs
      security: []
      description: Authentication is not required.
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - name: keyword
        in: query
        required: false
        schema:
          type: string
        description: Search text.
      - name: location
        in: query
        required: false
        schema:
          type: string
        description: Location text.
      - name: jobType
        in: query
        required: false
        schema:
          type: string
        description: Filter by jobType.
      - name: remotePolicy
        in: query
        required: false
        schema:
          type: string
        description: Filter by remotePolicy.
      - name: experienceLevel
        in: query
        required: false
        schema:
          type: string
        description: Filter by experienceLevel.
      - name: companyId
        in: query
        required: false
        schema:
          type: string
        description: Filter by companyId.
      - name: salaryMin
        in: query
        required: false
        schema:
          type: number
        description: Minimum acceptable salary; the mock compares against salaryMax.
      - name: skills
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Comma-separated skills, e.g. React,TypeScript.
        style: form
        explode: false
      - name: postedWithin
        in: query
        required: false
        schema:
          type: number
        description: Maximum posting age in days.
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - recent
          - salary
          - relevance
        description: Requested ordering; the mock treats relevance like recent.
  /jobs/{id}/:
    get:
      operationId: getJob
      summary: Get a job
      tags:
      - jobs
      security: []
      description: Authentication is not required.
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'
  /companies/:
    get:
      operationId: listCompanies
      summary: List companies
      tags:
      - companies
      security: []
      description: Authentication is not required.
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Company'
        default:
          $ref: '#/components/responses/Error'
  /companies/{id}/:
    get:
      operationId: getCompany
      summary: Get a company
      tags:
      - companies
      security: []
      description: Authentication is not required.
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        default:
          $ref: '#/components/responses/Error'
  /jobs/recommended/:
    get:
      operationId: recommendJobs
      summary: Get jobs recommended for the candidate
      tags:
      - jobs
      description: Requires an authenticated candidate session; access is scoped to the current candidate.
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'
        '401':
          description: A required session is missing or invalid (when applicable to token verification).
            Error body is unspecified.
        '403':
          description: Permission, ownership, or CSRF validation failed. Error body is unspecified.
  /saved-jobs/:
    get:
      operationId: listSavedJobs
      summary: List saved jobs
      tags:
      - saved-jobs
      description: Requires an authenticated candidate session; access is scoped to the current candidate.
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
        default:
          $ref: '#/components/responses/Error'
        '401':
          description: A required session is missing or invalid (when applicable to token verification).
            Error body is unspecified.
        '403':
          description: Permission, ownership, or CSRF validation failed. Error body is unspecified.
    post:
      operationId: saveJob
      summary: Save a job
      tags:
      - saved-jobs
      description: Requires an authenticated candidate session; access is scoped to the current candidate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveJobInput'
      responses:
        '204':
          description: Successful operation; no response body.
        default:
          $ref: '#/components/responses/Error'
        '401':
          description: A required session is missing or invalid (when applicable to token verification).
            Error body is unspecified.
        '403':
          description: Permission, ownership, or CSRF validation failed. Error body is unspecified.
  /saved-jobs/{id}/:
    delete:
      operationId: unsaveJob
      summary: Unsave a job
      tags:
      - saved-jobs
      description: Requires an authenticated candidate session; access is scoped to the current candidate.
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Successful operation; no response body.
        default:
          $ref: '#/components/responses/Error'
        '401':
          description: A required session is missing or invalid (when applicable to token verification).
            Error body is unspecified.
        '403':
          description: Permission, ownership, or CSRF validation failed. Error body is unspecified.
  /auth/me/:
    get:
      operationId: getCurrentUser
      summary: Get the current user
      tags:
      - auth
      description: Requires an authenticated session.
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Error'
        '401':
          description: A required session is missing or invalid (when applicable to token verification).
            Error body is unspecified.
        '403':
          description: Permission, ownership, or CSRF validation failed. Error body is unspecified.
  /auth/register/:
    post:
      operationId: registerAccount
      summary: Register and establish a session
      tags:
      - auth
      security: []
      description: Authentication is not required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRegistration'
      responses:
        '201':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Error'
  /auth/login/:
    post:
      operationId: login
      summary: Sign in and establish a session
      tags:
      - auth
      security: []
      description: Authentication is not required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Error'
  /auth/verify-email/:
    post:
      operationId: verifyEmail
      summary: Verify an email address
      tags:
      - auth
      description: No session is required when a valid verification token is supplied. Tokenless calls
        send {} and require a current session plus backend-defined verification behavior; production verification
        policy is not specified by the client.
      security:
      - {}
      - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailInput'
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Error'
        '401':
          description: A required session is missing or invalid (when applicable to token verification).
            Error body is unspecified.
        '403':
          description: Permission, ownership, or CSRF validation failed. Error body is unspecified.
  /auth/password-reset/:
    post:
      operationId: requestPasswordReset
      summary: Request a password reset email
      tags:
      - auth
      security: []
      description: Authentication is not required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetInput'
      responses:
        '204':
          description: Successful operation; no response body.
        default:
          $ref: '#/components/responses/Error'
  /auth/demo-role/:
    post:
      operationId: switchRole
      summary: Switch the demo user role
      tags:
      - auth
      description: Requires an authenticated session. Demo-only operation; production availability must
        be decided by the backend.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoRoleInput'
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Error'
        '401':
          description: A required session is missing or invalid (when applicable to token verification).
            Error body is unspecified.
        '403':
          description: Permission, ownership, or CSRF validation failed. Error body is unspecified.
  /candidate/profile/:
    get:
      operationId: getProfile
      summary: Get the candidate profile
      tags:
      - candidate
      description: Requires an authenticated candidate session; access is scoped to the current candidate.
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateProfile'
        default:
          $ref: '#/components/responses/Error'
        '401':
          description: A required session is missing or invalid (when applicable to token verification).
            Error body is unspecified.
        '403':
          description: Permission, ownership, or CSRF validation failed. Error body is unspecified.
    patch:
      operationId: updateProfile
      summary: Partially update the candidate profile
      tags:
      - candidate
      description: Requires an authenticated candidate session; access is scoped to the current candidate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateProfilePatch'
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateProfile'
        default:
          $ref: '#/components/responses/Error'
        '401':
          description: A required session is missing or invalid (when applicable to token verification).
            Error body is unspecified.
        '403':
          description: Permission, ownership, or CSRF validation failed. Error body is unspecified.
  /candidate/applications/:
    get:
      operationId: listApplications
      summary: List the candidate applications
      tags:
      - candidate
      description: Requires an authenticated candidate session; access is scoped to the current candidate.
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Application'
        default:
          $ref: '#/components/responses/Error'
        '401':
          description: A required session is missing or invalid (when applicable to token verification).
            Error body is unspecified.
        '403':
          description: Permission, ownership, or CSRF validation failed. Error body is unspecified.
  /applications/:
    post:
      operationId: submitApplication
      summary: Submit a signed-in application
      tags:
      - applications
      description: Requires an authenticated candidate session; access is scoped to the current candidate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationInput'
      responses:
        '201':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        default:
