          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        default:
          $ref: '#/components/responses/Error'
        '401':
          description: A required session is missing or invalid (when applicable to token verification).
            Error body is unspecified.
        '403':
          description: Permission, ownership, or CSRF validation failed. Error body is unspecified.
  /notifications/:
    get:
      operationId: listNotifications
      summary: List the current user notifications
      tags:
      - notifications
      description: Requires an authenticated session.
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
        default:
          $ref: '#/components/responses/Error'
        '401':
          description: A required session is missing or invalid (when applicable to token verification).
