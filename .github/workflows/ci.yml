name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Keep an active push run alive so Terraform deployments are not canceled
  # midway; GitHub retains the newest pending run for this concurrency group.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend-tests:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install frontend and integration backend dependencies
        run: npm --prefix frontend ci
      - name: Install backend runtime used by frontend integration tests
        working-directory: backend
        run: uv sync --frozen

      - name: Run frontend tests and live API integration
        env:
          STEADWORK_STORE: inmemory
        run: npm --prefix frontend test

      - name: Typecheck and build frontend
        run: npm --prefix frontend run build

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Run backend tests
        working-directory: backend
        run: uv run pytest -q

  full-validation:
    name: Full validation and Compose E2E
    # Playwright 1.55.1 does not provide Chromium builds for Ubuntu 26.04;
    # keep the browser job on a supported, stable runner image.
    runs-on: ubuntu-24.04
    needs: [frontend-tests, backend-tests]
    # Fork PRs do not receive repository secrets. Their parallel unit jobs
    # still run; secret-dependent Compose E2E runs on same-repository PRs
    # and pushes to main.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install test dependencies and Playwright Chromium
        run: make test-setup

      - name: Check whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          if [ "$BASE_SHA" = "$GITHUB_SHA" ]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          git diff --check "$BASE_SHA"...HEAD

      - name: Validate the root Compose service set
        env:
          POSTGRES_DB: ci_check
          POSTGRES_USER: ci_check
          POSTGRES_PASSWORD: config-only-placeholder
        run: |
          services="$(docker compose config --services | sort)"
          expected="$(printf 'app\npostgres')"
          if [ "$services" != "$expected" ]; then
            printf 'Unexpected Compose services:\n%s\n' "$services" >&2
            exit 1
          fi

      - name: Build the application image
        env:
          POSTGRES_DB: ci_build
          POSTGRES_USER: ci_build
          POSTGRES_PASSWORD: build-only-placeholder
        run: docker compose build app

      - name: Run all tests, including isolated Compose E2E
        env:
          E2E_CANDIDATE_EMAIL: ${{ secrets.E2E_CANDIDATE_EMAIL }}
          E2E_CANDIDATE_PASSWORD: ${{ secrets.E2E_CANDIDATE_PASSWORD }}
          E2E_RECRUITER_EMAIL: ${{ secrets.E2E_RECRUITER_EMAIL }}
          E2E_RECRUITER_PASSWORD: ${{ secrets.E2E_RECRUITER_PASSWORD }}
        run: make test

  deploy-dev:
    name: Publish image and deploy development
    runs-on: ubuntu-24.04
    needs: [full-validation]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    environment: development
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_OWNER_ID: ${{ vars.RENDER_OWNER_ID }}
      RENDER_WAIT_FOR_DEPLOY_COMPLETION: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate timestamped image tag
        id: image
        env:
          GHCR_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          image="ghcr.io/$(printf '%s' "$GHCR_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          tag="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          echo "image_url=$image" >> "$GITHUB_OUTPUT"
          echo "image_tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build and publish image to GHCR
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.image_url }}:${{ steps.image.outputs.image_tag }}

      - name: Create Render project and environments
        run: |
          terraform -chdir=deployment/terraform/bootstrap init \
            -backend-config="organization=$TF_CLOUD_ORGANIZATION"
          terraform -chdir=deployment/terraform/bootstrap apply -auto-approve \
            -var="project_name=steadwork"

      - name: Deploy the image and database to Render development
        id: deploy
        env:
          IMAGE_URL: ${{ steps.image.outputs.image_url }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          terraform -chdir=deployment/terraform/dev init \
            -backend-config="organization=$TF_CLOUD_ORGANIZATION"
          terraform -chdir=deployment/terraform/dev apply -auto-approve \
            -var="terraform_organization=$TF_CLOUD_ORGANIZATION" \
            -var="image_url=$IMAGE_URL" \
            -var="image_digest=$IMAGE_DIGEST"
          service_url="$(terraform -chdir=deployment/terraform/dev output -raw service_url)"
          echo "service_url=$service_url" >> "$GITHUB_OUTPUT"

      - name: Verify development is healthy
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.service_url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$SERVICE_URL/api/health/"; then
              echo
              exit 0
            fi
            echo "Health check attempt $attempt/30 failed; retrying in 5 seconds."
            sleep 5
          done
          echo "Development did not become healthy at $SERVICE_URL/api/health/" >&2
          exit 1

      - name: Point the dev tag at the successfully deployed image
        env:
          IMAGE_URL: ${{ steps.image.outputs.image_url }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --prefer-index=false \
            --tag "$IMAGE_URL:dev" "$IMAGE_URL@$IMAGE_DIGEST"
          echo "Deployed $IMAGE_URL:$IMAGE_TAG to dev and updated $IMAGE_URL:dev."
