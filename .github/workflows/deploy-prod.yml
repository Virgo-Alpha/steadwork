name: Promote image to production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional timestamped tag for rollback; leave blank to deploy the latest successful dev image
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: steadwork-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy selected image to Render production
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_OWNER_ID: ${{ vars.RENDER_OWNER_ID }}
      RENDER_WAIT_FOR_DEPLOY_COMPLETION: "true"
      IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
      GHCR_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve requested tag to an immutable image digest
        id: image
        run: |
          set -euo pipefail
          image="ghcr.io/$(printf '%s' "$GHCR_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          tag="${IMAGE_TAG_INPUT:-dev}"
          if [[ "$tag" != "dev" && ! "$tag" =~ ^[0-9]{8}-[0-9]{6}-[0-9a-f]{7}$ ]]; then
            echo 'image_tag must be blank (latest successful dev image) or a timestamped YYYYMMDD-HHMMSS-shortsha tag.' >&2
            exit 1
          fi
          manifest="$(docker buildx imagetools inspect "$image:$tag" --format '{{json .Manifest}}')"
          digest="$(printf '%s' "$manifest" | jq -er '.digest')"
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve $image:$tag to a valid sha256 digest." >&2
            exit 1
          fi
          echo "image_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image_url=$image" >> "$GITHUB_OUTPUT"
          echo "image_digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Resolved $image:$tag to $image@$digest"

      - name: Create or refresh Render project and environments
        run: |
          terraform -chdir=deployment/terraform/bootstrap init \
            -backend-config="organization=$TF_CLOUD_ORGANIZATION"
          terraform -chdir=deployment/terraform/bootstrap apply -auto-approve \
            -var="project_name=steadwork"

      - name: Deploy the selected image and database to Render production
        id: deploy
        env:
          IMAGE_URL: ${{ steps.image.outputs.image_url }}
          IMAGE_DIGEST: ${{ steps.image.outputs.image_digest }}
        run: |
          terraform -chdir=deployment/terraform/prod init \
            -backend-config="organization=$TF_CLOUD_ORGANIZATION"
          terraform -chdir=deployment/terraform/prod apply -auto-approve \
            -var="terraform_organization=$TF_CLOUD_ORGANIZATION" \
            -var="image_url=$IMAGE_URL" \
            -var="image_digest=$IMAGE_DIGEST"
          service_url="$(terraform -chdir=deployment/terraform/prod output -raw service_url)"
          echo "service_url=$service_url" >> "$GITHUB_OUTPUT"

      - name: Verify production is healthy
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.service_url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$SERVICE_URL/api/health/"; then
              echo
              exit 0
            fi
            echo "Health check attempt $attempt/30 failed; retrying in 5 seconds."
            sleep 5
          done
          echo "Production did not become healthy at $SERVICE_URL/api/health/" >&2
          exit 1

      - name: Point the prod tag at the successfully deployed image
        env:
          IMAGE_URL: ${{ steps.image.outputs.image_url }}
          IMAGE_DIGEST: ${{ steps.image.outputs.image_digest }}
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --prefer-index=false \
            --tag "$IMAGE_URL:prod" "$IMAGE_URL@$IMAGE_DIGEST"
          echo "Deployed $IMAGE_URL:$IMAGE_TAG to production and updated $IMAGE_URL:prod."
