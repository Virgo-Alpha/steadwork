apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: "trace_id=([0-9a-f]{32})"
          # Escape Grafana's macro in provisioning YAML so it is retained until the link is clicked.
          url: '$${__value.raw}'
          urlDisplayLabel: Open trace
          datasourceUid: tempo

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -2m
        spanEndTimeShift: 2m
        tags:
          - key: service.name
            value: service_name
          - key: service.version
            value: service_version
        filterByTraceID: true
        filterBySpanID: true
        customQuery: true
        # Escape Grafana query macros so provisioning preserves them for runtime interpolation.
        query: '{service_name="steadwork-api"} |= "$${__trace.traceId}" |= "span_id=$${__span.spanId}"'
      search:
        hide: false
      nodeGraph:
        enabled: true
